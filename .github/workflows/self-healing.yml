name: Self-Healing AI Agent

on:
  # Run every 10 minutes
  schedule:
    - cron: '*/10 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - detect-only
          - generate-release

  # Run on push to master
  push:
    branches:
      - master
    paths:
      - '**.py'
      - 'c4.yml'
  
  # Run on pull requests
  pull_request:
    branches:
      - master

jobs:
  # ============================================
  # Job 1: Self-Healing Workflow (Every 10 min)
  # ============================================
  self-healing:
    name: 🤖 Run Self-Healing Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Run Self-Healing Workflow
        run: |
          python -c "
          from self_healing_agent import SelfHealingOrchestrator
          from self_healing_agent.bug_detector import BugReport, BugType, BugSeverity
          from datetime import datetime
          
          orchestrator = SelfHealingOrchestrator()
          
          # Process sample bugs for demonstration
          bugs = [
              BugReport(
                  bug_id=f'GH-$(date +%Y%m%d-%H%M%S)-001',
                  bug_type=BugType.TYPE_ERROR,
                  severity=BugSeverity.MEDIUM,
                  message='Simulated TypeError',
                  file_path=None,
                  line_number=10,
                  stack_trace=None,
                  source='github-actions'
              )
          ]
          
          for bug in bugs:
              result = orchestrator.process_bug(bug)
              print(f'Bug: {bug.bug_id}, Success: {result.success}')
          
          stats = orchestrator.get_statistics()
          print(f'Stats: {stats}')
          "

      - name: Generate Release Notes
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'generate-release'
        run: |
          python -c "
          from self_healing_agent.releases import ReleaseGenerator
          from self_healing_agent.releases.generator import WorkflowStats
          from datetime import datetime
          import yaml
          
          # Load config
          with open('c4.yml', 'r') as f:
              config = yaml.safe_load(f)
          
          generator = ReleaseGenerator(config)
          
          stats = WorkflowStats(
              bugs_detected=5,
              bugs_fixed=3,
              total_runs=10,
              success_rate=75.0,
              avg_fix_time=2.5,
              last_run=datetime.now()
          )
          
          result = generator.generate_and_save(stats)
          print(f'Release generated: {result}')
          "

      - name: Upload Release Notes
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'generate-release'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            releases/
            CHANGELOG.md
          retention-days: 30

      - name: Commit Release Notes
        if: github.event_name == 'schedule'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/ CHANGELOG.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "docs: Auto-generated release notes [skip ci]"
          git push || true

  # ============================================
  # Job 2: Run Tests
  # ============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 7

  # ============================================
  # Job 3: Code Quality Check
  # ============================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ruff black

      - name: Check code format
        run: |
          ruff check . || true
          black --check . || true

  # ============================================
  # Job 4: Static Analysis
  # ============================================
  static-analysis:
    name: 📊 Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run static analysis
        run: |
          pip install py_compile
          find . -name "*.py" -type f | while read file; do
            python -m py_compile "$file" 2>&1 && echo "✓ $file" || echo "✗ $file"
          done

  # ============================================
  # Job 5: Build & Package
  # ============================================
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5
