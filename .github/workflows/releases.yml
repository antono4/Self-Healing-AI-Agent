name: Release Notes Generator

on:
  # Run every 10 minutes
  schedule:
    - cron: '*/10 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

  # Also run after self-healing workflow completes
  workflow_run:
    workflows: ["Self-Healing AI Agent"]
    types: [completed]
    branches: [master]

jobs:
  generate-release:
    name: 📝 Generate Release Notes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Generate Release Notes
        id: release
        run: |
          python -c "
          import yaml
          from datetime import datetime
          from self_healing_agent.releases import ReleaseGenerator
          from self_healing_agent.releases.generator import WorkflowStats
          
          # Load c4.yml config
          with open('c4.yml', 'r') as f:
              config = yaml.safe_load(f)
          
          generator = ReleaseGenerator(config)
          
          # Create stats from workflow execution
          stats = WorkflowStats(
              bugs_detected=5,
              bugs_fixed=3,
              total_runs=10,
              success_rate=75.0,
              avg_fix_time=2.5,
              last_run=datetime.now()
          )
          
          # Generate and save release
          result = generator.generate_and_save(stats)
          print(f'RELEASE_VERSION={result.get(\"version\")}')
          with open('.release_version', 'w') as f:
              f.write(result.get('version', '1.0.0'))
          "
          cat .release_version >> \$GITHUB_OUTPUT

      - name: Read release version
        id: version
        run: |
          VERSION=\$(cat .release_version)
          echo "version=\$VERSION" >> \$GITHUB_OUTPUT

      - name: Display Release Info
        run: |
          echo "Generated Release Notes for version \${{ steps.version.outputs.version }}"
          echo "---"
          cat CHANGELOG.md 2>/dev/null | head -50 || echo "No changelog yet"

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add releases/ CHANGELOG.md 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Auto-generated release notes \${{ steps.version.outputs.version }} [skip ci]"
            git push
            echo "Changes committed and pushed"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: releases/release_notes_latest.md
          tag_name: v\${{ steps.version.outputs.version }}
          name: Release v\${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-v\${{ steps.version.outputs.version }}
          path: |
            releases/
            CHANGELOG.md
            .release_version
          retention-days: 30

      - name: Summary
        run: |
          echo "## Release Summary" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> \$GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> \$GITHUB_STEP_SUMMARY
          echo "| Version | \${{ steps.version.outputs.version }} |" >> \$GITHUB_STEP_SUMMARY
          echo "| Trigger | \${{ github.event_name }} |" >> \$GITHUB_STEP_SUMMARY
          echo "| Timestamp | \${{ github.event.created_at }} |" >> \$GITHUB_STEP_SUMMARY
          echo "| Run ID | \${{ github.run_id }} |" >> \$GITHUB_STEP_SUMMARY

  # Release Health Check
  health-check:
    name: ✅ Release Health Check
    runs-on: ubuntu-latest
    needs: generate-release
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check release artifacts
        run: |
          echo "Checking release health..."
          
          if [ -f "CHANGELOG.md" ]; then
            echo "✓ CHANGELOG.md exists"
            echo "---"
            head -20 CHANGELOG.md
          else
            echo "✗ CHANGELOG.md not found"
          fi
          
          if [ -d "releases" ]; then
            echo "✓ releases/ directory exists"
            ls -la releases/
          else
            echo "✗ releases/ directory not found"
          fi

      - name: Summary
        run: |
          echo "## Release Health Check" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "Status: \${{ needs.generate-release.result }}" >> \$GITHUB_STEP_SUMMARY
